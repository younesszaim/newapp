<div class="flex flex-wrap items-start justify-between gap-4">
  <div>
    <div class="flex flex-wrap gap-3 text-xs">
      <span class="rounded-full bg-emerald-50 px-3 py-1 font-semibold text-emerald-800">* Obligatoire</span>
      <span class="rounded-full bg-slate-100 px-3 py-1 font-medium text-slate-600">Optionnel · vide = 0 €</span>
    </div>
    <p class="mt-2 text-sm text-slate-500">Cliquez dans une cellule pour saisir un montant en euros.</p>
  </div>
  <button type="button" class="h-10 rounded-md border border-[#008C7A] bg-white px-4 text-sm font-semibold text-[#007B69] hover:bg-emerald-50 disabled:cursor-not-allowed disabled:border-slate-300 disabled:text-slate-400 disabled:hover:bg-white" [disabled]="rows().length >= maxRows" (click)="addRow()">
    + Ajouter une ligne
  </button>
</div>

<div class="mt-5 overflow-hidden rounded-lg border border-slate-200">
  <ag-grid-angular
    class="block w-full"
    [theme]="theme"
    [rowData]="rows()"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    [domLayout]="'autoHeight'"
    [singleClickEdit]="true"
    [stopEditingWhenCellsLoseFocus]="true"
    (gridReady)="onGridReady($event)"
    (cellClicked)="handleCellClicked($event)"
  />
</div>

@if (validationError()) {
  <p class="mt-4 rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">{{ validationError() }}</p>
}

<div class="mt-6 flex items-center justify-between border-t border-slate-100 pt-5">
  <p class="text-sm text-slate-500">{{ rows().length }} deal{{ rows().length > 1 ? 's' : '' }} fictif{{ rows().length > 1 ? 's' : '' }}</p>
  <button type="button" class="inline-flex h-10 items-center justify-center rounded-md bg-[#008C7A] px-4 text-sm font-semibold text-white shadow-sm hover:bg-[#00675B]" (click)="submit()">
    Vérifier et enregistrer
  </button>
</div>
