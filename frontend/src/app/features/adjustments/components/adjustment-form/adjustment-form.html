<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="grid gap-5 md:grid-cols-2">
    <label class="block">
      <span class="mb-2 block text-sm font-medium text-slate-700">
        Ajustement LCR réglementaire <span class="text-red-600">*</span>
      </span>
      <div class="relative">
        <input
          type="number"
          step="0.01"
          formControlName="ldpImpactLcrReglementaire"
          class="h-10 w-full rounded-md border border-slate-300 bg-white px-3 pr-10 text-sm shadow-sm outline-none transition focus:border-[#008C7A] focus:ring-2 focus:ring-[#008C7A]/15"
        />
        <span class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-sm text-slate-400">€</span>
      </div>
      @if (form.controls.ldpImpactLcrReglementaire.touched && form.controls.ldpImpactLcrReglementaire.invalid) {
        <span class="mt-1.5 block text-xs text-red-600">Ce montant est obligatoire.</span>
      }
    </label>

    <label class="block">
      <span class="mb-2 block text-sm font-medium text-slate-700">
        Ajustement LCR gestion <span class="text-red-600">*</span>
      </span>
      <div class="relative">
        <input
          type="number"
          step="0.01"
          formControlName="ldpImpactLcrGestion"
          class="h-10 w-full rounded-md border border-slate-300 bg-white px-3 pr-10 text-sm shadow-sm outline-none transition focus:border-[#008C7A] focus:ring-2 focus:ring-[#008C7A]/15"
        />
        <span class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-sm text-slate-400">€</span>
      </div>
      @if (form.controls.ldpImpactLcrGestion.touched && form.controls.ldpImpactLcrGestion.invalid) {
        <span class="mt-1.5 block text-xs text-red-600">Ce montant est obligatoire.</span>
      }
    </label>
  </div>

  <button
    type="button"
    class="mt-5 inline-flex items-center gap-2 rounded-md text-sm font-medium text-[#00675B] hover:text-[#004E45]"
    (click)="toggleAdvancedFields()"
    [attr.aria-expanded]="advancedFieldsVisible()"
  >
    <span>{{ advancedFieldsVisible() ? '−' : '+' }}</span>
    Champs avancés
  </button>

  @if (advancedFieldsVisible()) {
    <div class="mt-4 grid gap-5 rounded-lg border border-slate-200 bg-slate-50 p-4 md:grid-cols-2">
      <label class="block">
        <span class="mb-2 block text-sm font-medium text-slate-700">Impact LCR inflow</span>
        <input type="number" step="0.01" formControlName="impactLcrInflow"
          class="h-10 w-full rounded-md border border-slate-300 bg-white px-3 text-sm shadow-sm outline-none focus:border-[#008C7A] focus:ring-2 focus:ring-[#008C7A]/15" />
      </label>
      <label class="block">
        <span class="mb-2 block text-sm font-medium text-slate-700">Impact LCR outflow</span>
        <input type="number" step="0.01" formControlName="impactLcrOutflow"
          class="h-10 w-full rounded-md border border-slate-300 bg-white px-3 text-sm shadow-sm outline-none focus:border-[#008C7A] focus:ring-2 focus:ring-[#008C7A]/15" />
      </label>
      <label class="block">
        <span class="mb-2 block text-sm font-medium text-slate-700">Impact LCR asset</span>
        <input type="number" step="0.01" formControlName="impactLcrAsset"
          class="h-10 w-full rounded-md border border-slate-300 bg-white px-3 text-sm shadow-sm outline-none focus:border-[#008C7A] focus:ring-2 focus:ring-[#008C7A]/15" />
      </label>
      <label class="block">
        <span class="mb-2 block text-sm font-medium text-slate-700">Impact LCR asset cash</span>
        <input type="number" step="0.01" formControlName="impactLcrAssetCash"
          class="h-10 w-full rounded-md border border-slate-300 bg-white px-3 text-sm shadow-sm outline-none focus:border-[#008C7A] focus:ring-2 focus:ring-[#008C7A]/15" />
      </label>
    </div>
  }

  <div class="mt-6 flex justify-end border-t border-slate-100 pt-5">
    <button
      type="submit"
      class="inline-flex h-10 items-center justify-center rounded-md bg-[#008C7A] px-4 text-sm font-semibold text-white shadow-sm transition hover:bg-[#00675B] focus:outline-none focus:ring-2 focus:ring-[#008C7A]/30 focus:ring-offset-2"
    >
      Prévisualiser l'ajustement
    </button>
  </div>
</form>
