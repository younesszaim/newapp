<div class="grid gap-3 border-b border-slate-200 bg-slate-50/70 p-4 sm:grid-cols-2 xl:grid-cols-4" aria-label="Totaux LCR">
  <div class="rounded-lg border border-slate-200 bg-white px-4 py-3 shadow-sm">
    <p class="text-xs font-medium uppercase tracking-wide text-slate-500">Total 0D</p>
    <p class="mt-1 text-lg font-semibold tabular-nums text-[#18324A]">{{ summary.total.amount0d | compactEuro }}</p>
  </div>
  <div class="rounded-lg border border-slate-200 bg-white px-4 py-3 shadow-sm">
    <p class="text-xs font-medium uppercase tracking-wide text-slate-500">Total 30D</p>
    <p class="mt-1 text-lg font-semibold tabular-nums text-[#18324A]">{{ summary.total.amount30d | compactEuro }}</p>
  </div>
  <div class="rounded-lg border border-[#BFE3DC] bg-[#F0F9F7] px-4 py-3 shadow-sm">
    <p class="text-xs font-medium uppercase tracking-wide text-slate-500">Total réglementaire</p>
    <p class="mt-1 text-lg font-semibold tabular-nums text-[#00675B]">{{ summary.total.lcrReglementaire | compactEuro }}</p>
  </div>
  <div class="rounded-lg border border-[#BFE3DC] bg-[#F0F9F7] px-4 py-3 shadow-sm">
    <p class="text-xs font-medium uppercase tracking-wide text-slate-500">Total gestion</p>
    <p class="mt-1 text-lg font-semibold tabular-nums text-[#00675B]">{{ summary.total.lcrGestion | compactEuro }}</p>
  </div>
</div>

<ag-grid-angular
  class="block w-full"
  domLayout="autoHeight"
  [theme]="theme"
  [rowData]="summary.rows"
  [columnDefs]="columnDefs"
  [defaultColDef]="defaultColDef"
  [enableBrowserTooltips]="true"
  [animateRows]="false"
  [rowHeight]="48"
  [headerHeight]="44"
/>
