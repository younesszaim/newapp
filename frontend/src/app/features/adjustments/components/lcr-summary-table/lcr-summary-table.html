<ag-grid-angular
  class="block w-full"
  domLayout="autoHeight"
  [theme]="theme"
  [rowData]="summary.rows"
  [columnDefs]="columnDefs"
  [defaultColDef]="defaultColDef"
  [enableBrowserTooltips]="true"
  [animateRows]="false"
  [rowHeight]="48"
  [headerHeight]="44"
/>

<div class="grid border-t border-slate-200 bg-slate-50 sm:grid-cols-2 xl:grid-cols-4" aria-label="Totaux LCR">
  <div class="border-b border-slate-200 px-5 py-3 sm:border-r xl:border-b-0">
    <p class="text-xs font-medium uppercase tracking-wide text-slate-500">Total 0D</p>
    <p class="mt-1 font-semibold tabular-nums text-[#18324A]">{{ summary.total.amount0d | compactEuro }}</p>
  </div>
  <div class="border-b border-slate-200 px-5 py-3 xl:border-b-0 xl:border-r">
    <p class="text-xs font-medium uppercase tracking-wide text-slate-500">Total 30D</p>
    <p class="mt-1 font-semibold tabular-nums text-[#18324A]">{{ summary.total.amount30d | compactEuro }}</p>
  </div>
  <div class="border-b border-slate-200 px-5 py-3 sm:border-b-0 sm:border-r">
    <p class="text-xs font-medium uppercase tracking-wide text-slate-500">Total réglementaire</p>
    <p class="mt-1 font-semibold tabular-nums text-[#00675B]">{{ summary.total.lcrReglementaire | compactEuro }}</p>
  </div>
  <div class="px-5 py-3">
    <p class="text-xs font-medium uppercase tracking-wide text-slate-500">Total gestion</p>
    <p class="mt-1 font-semibold tabular-nums text-[#00675B]">{{ summary.total.lcrGestion | compactEuro }}</p>
  </div>
</div>
