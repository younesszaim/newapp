<div class="grid gap-5 md:grid-cols-2">
  <label class="block">
    <span class="mb-2 block text-sm font-medium text-slate-700">Date d'arrêté</span>
    <select
      class="h-10 w-full rounded-md border border-slate-300 bg-white px-3 text-sm text-slate-900 shadow-sm outline-none transition focus:border-[#008C7A] focus:ring-2 focus:ring-[#008C7A]/15 disabled:cursor-not-allowed disabled:bg-slate-100 disabled:text-slate-500"
      [value]="selectedAsofdate ?? ''"
      [disabled]="loadingDates"
      (change)="onAsofdateChange($event)"
    >
      <option value="">Sélectionner une date</option>
      @for (asofdate of asofdates; track asofdate) {
        <option [value]="asofdate">{{ asofdate }}</option>
      }
    </select>
    @if (loadingDates) {
      <span class="mt-2 block text-xs text-slate-500">Chargement des dates...</span>
    }
  </label>

  <label class="block">
    <span class="mb-2 block text-sm font-medium text-slate-700">Version</span>
    <select
      class="h-10 w-full rounded-md border border-slate-300 bg-white px-3 text-sm text-slate-900 shadow-sm outline-none transition focus:border-[#008C7A] focus:ring-2 focus:ring-[#008C7A]/15 disabled:cursor-not-allowed disabled:bg-slate-100 disabled:text-slate-500"
      [value]="selectedVersion ?? ''"
      [disabled]="!selectedAsofdate || loadingVersions"
      (change)="onVersionChange($event)"
    >
      <option value="">Sélectionner une version</option>
      @for (version of versions; track version) {
        <option [value]="version">{{ version.replace('T', ' ') }}</option>
      }
    </select>
    @if (loadingVersions) {
      <span class="mt-2 block text-xs text-slate-500">Chargement des versions...</span>
    }
  </label>
</div>
